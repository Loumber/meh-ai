name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd mobile
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - name: Rename APK with version
        run: |
          VERSION="0.0.${{ github.run_number }}"
          mv mobile/app/build/outputs/apk/debug/app-debug.apk \
            "mobile/app/build/outputs/apk/debug/meh-ai-${VERSION}.apk"
          echo "### Android ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: meh-ai-0.0.${{ github.run_number }}
          path: mobile/app/build/outputs/apk/debug/meh-ai-0.0.${{ github.run_number }}.apk
